services:
  # 1. FinSage BFF Server (Node.js Express + Prisma + OCR worker)
  - type: web
    name: finsage-bff
    env: node
    plan: free
    rootDir: apps/bff-server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_ENGINE_URL
        sync: false

  # 2. FinSage AI Engine (Python FastAPI Analytics & Multi-Agent)
  - type: web
    name: finsage-ai-engine
    env: python
    plan: free
    rootDir: apps/ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
